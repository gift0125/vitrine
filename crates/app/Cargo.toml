[package]
name = "simple-media-player"
version = "1.0.0"
edition = "2021"
description = "轻量跨平台媒体播放器（GPUI Kit + rodio/mpv）"
license = "MIT"

[dependencies]
gpui-kit = { workspace = true }
player-core = { path = "../player-core" }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
directories = "6"
raw-window-handle = "0.6"
# 把 mpv 的软件渲染帧包成 GPUI 纹理：`RenderImage` 的入参是 `image::Frame`，
# 必须和 gpui-pre 用同一个 `image` 版本（0.25），否则类型对不上。
image = "0.25"
# mpv 的「有新帧了」回调跑在它自己的线程上，只能用一条线程安全的信号通道叫醒 UI。
async-channel = "2"

[target.'cfg(windows)'.build-dependencies]
# 把图标 + 版本信息写进 exe 的 PE 资源（GPUI 只认 ID=1 的图标组，见 build.rs）
embed-resource = "3"

[dev-dependencies]
# UI 集成测试需要无头窗口驱动（`gpui_kit::test`），只在测试构建打开该 feature。
gpui-kit = { workspace = true, features = ["test-support"] }
# 构造 `ExternalPaths`（拖放载荷）要写它的字段，而字段类型是 smallvec；
# 必须与 gpui-pre 用同一个 smallvec 版本，否则类型对不上。
smallvec = "1"
